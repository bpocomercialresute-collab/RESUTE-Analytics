<!-- ============================================================
     PAINEL DRE — RESUTE
     Bloco HTML. Sem <html>/<head>/<body>/<script>.
     Todo id/classe novo usa prefixo fin- (namespace fin-dre-).
     ============================================================ -->

<div class="fin-wrap">

  <!-- ===================== CABEÇALHO ===================== -->
  <header class="fin-topo">
    <div class="fin-topo-esq">
      <button id="fin-admin-back" class="fin-btn-voltar" title="Voltar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="fin-titulo-bloco">
        <div class="fin-titulo-linha">
          <h1 id="fin-empresa">—</h1>
          <span id="fin-admin-preview-badge" class="fin-badge-preview">PREVIEW</span>
        </div>
        <p class="fin-subtitulo">Demonstrativo de Resultado do Exercício</p>
      </div>
    </div>
  </header>

  <!-- ===================== FILTROS ===================== -->
  <section class="fin-filtros">
    <div class="fin-campo">
      <label for="fin-filtro-ano">Ano</label>
      <select id="fin-filtro-ano"></select>
    </div>
    <div class="fin-campo">
      <label for="fin-filtro-mes">Mês</label>
      <select id="fin-filtro-mes"></select>
    </div>
    <div class="fin-campo">
      <label for="fin-filtro-inicio">Início</label>
      <input type="date" id="fin-filtro-inicio">
    </div>
    <div class="fin-campo">
      <label for="fin-filtro-fim">Fim</label>
      <input type="date" id="fin-filtro-fim">
    </div>
    <button id="fin-btn-atualizar" class="fin-btn-primario">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
      </svg>
      Atualizar
    </button>
    <button id="fin-dre-btn-exportar" class="fin-btn-secundario">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
      </svg>
      Exportar
    </button>
    <span id="fin-status" class="fin-status"></span>
  </section>

  <!-- ===================== ABAS ===================== -->
  <nav class="fin-tabs">
    <button class="fin-tab active" data-fin-pane="fin-dre-pane-bd">BD</button>
    <button class="fin-tab" data-fin-pane="fin-dre-pane-plano">Plano de Contas</button>
    <button class="fin-tab" data-fin-pane="fin-dre-pane-bddre">BD_DRE</button>
    <button class="fin-tab" data-fin-pane="fin-dre-pane-dre">Resultados</button>
  </nav>

  <!-- ---------- ABA 1: BD (livro-razão, entrada de dados) ---------- -->
  <section class="fin-pane active" id="fin-dre-pane-bd">
    <div class="fin-grid-acoes">
      <button type="button" id="fin-dre-bd-salvar" class="fin-btn-primario">Salvar no banco</button>
      <label class="fin-btn-secundario fin-btn-import-label" title="Importar CSV ou Excel colado">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Importar arquivo
        <input type="file" id="fin-dre-bd-importar" accept=".csv,.txt,.tsv,.xls,.xlsx" style="display:none">
      </label>
      <button type="button" id="fin-dre-bd-limpar" class="fin-btn-perigo">Limpar BD</button>
      <span id="fin-dre-status-bd" class="fin-status"></span>
    </div>
    <div id="fin-dre-tab-bd" class="fin-tabela-scroll"></div>
  </section>

  <!-- ---------- ABA 2: PLANO DE CONTAS ---------- -->
  <section class="fin-pane" id="fin-dre-pane-plano">
    <div class="fin-barra-filtro">
      <input type="text" id="fin-dre-busca-plano" placeholder="Buscar por código ou conta…">
      <select id="fin-dre-filtro-grupo"></select>
      <select id="fin-dre-filtro-fv">
        <option value="">F/V: todos</option>
        <option value="F">Fixo</option>
        <option value="V">Variável</option>
        <option value="-">Não marcado</option>
      </select>
      <select id="fin-dre-filtro-di">
        <option value="">D/I: todos</option>
        <option value="D">Direto</option>
        <option value="I">Indireto</option>
        <option value="-">Não marcado</option>
      </select>
    </div>
    <div class="fin-grid-acoes">
      <button type="button" id="fin-dre-salvar-plano" class="fin-btn-primario">Salvar no banco</button>
      <button type="button" id="fin-dre-plano-limpar" class="fin-btn-perigo">Limpar Plano</button>
      <span id="fin-dre-status-plano" class="fin-status"></span>
    </div>
    <div id="fin-dre-tab-plano" class="fin-tabela-scroll"></div>
  </section>

  <!-- ---------- ABA 3: BD_DRE ---------- -->
  <section class="fin-pane" id="fin-dre-pane-bddre">
    <div class="fin-barra-filtro">
      <select id="fin-dre-bddre-filtro-ano">
        <option value="">Ano: todos</option>
      </select>
      <select id="fin-dre-bddre-filtro-grupo">
        <option value="">Grupo: todos</option>
      </select>
      <select id="fin-dre-bddre-filtro-se">
        <option value="">S_E: todos</option>
        <option value="E">E — Entrada</option>
        <option value="S">S — Saída</option>
        <option value="0">0 — Extracontábil</option>
      </select>
      <input type="text" id="fin-dre-bddre-busca" placeholder="Buscar por código ou conta…">
    </div>
    <div id="fin-dre-tab-bddre" class="fin-tabela-scroll"></div>
  </section>

  <!-- ---------- ABA 4: RESULTADOS ---------- -->
  <section class="fin-pane" id="fin-dre-pane-dre">
    <div id="fin-dre-corpo" class="fin-dre-corpo"></div>
  </section>

</div>
